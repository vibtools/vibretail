# Paste these directives inside the aaPanel website's existing server { } block.
# Do not replace aaPanel's generated PHP-FPM location block.

index index.php index.html;
client_max_body_size 5m;
autoindex off;

# Friendly one-time installer route. install.php enforces its own installation lock.
location = /install { try_files /install.php =404; }

# Keep Let's Encrypt verification available while blocking hidden files.
location ~ /\.(?!well-known/) { deny all; }

# Internal source/maintenance surfaces must never be HTTP-accessible.
location ~* ^/(?:config\.php|installer-lib\.php|migrations\.php|product-images\.php|schema\.sql|backup\.php|restore\.php|uat\.php|migrate-product-images\.php|aapanel-setup\.php|aapanel-nginx\.conf|error_log|htdocs\.rar)$ { deny all; }
location ~* ^/(?:tools|migrations|storage/private|ui)(?:/|$) { deny all; }
location ~* \.(?:sql|log|bak|ini|env|rar|conf|zip|7z|tar|gz|tgz)$ { deny all; }

# Serve managed product images as static files and never execute scripts from uploads.
location ~* ^/uploads/.*\.(?:php[0-9]?|phtml|phar|cgi|pl|py|sh)$ { deny all; }
location /uploads/ {
    autoindex off;
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
}
